<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background: rounded square matching brand__mark -->
  <rect width="32" height="32" rx="7" fill="#15181C"/>
  <!-- Subtle inner highlight to match box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06) -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Italic serif L matching Playfair Display italic -->
  <text
    x="16"
    y="25"
    font-family="Georgia, 'Times New Roman', serif"
    font-style="italic"
    font-size="23"
    font-weight="500"
    fill="#F5F2EC"
    text-anchor="middle"
    dominant-baseline="auto"
  >L</text>
</svg>
